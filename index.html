<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snowie | Tissue Doll</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
:root{--wall:#a5d8b6;--wall2:#8cc7a0;--panel:#f6faf4;--text:#1f2d27;--line:#c5dccb;--ink:#2b2f9c;--accent:#2b2f9c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#35624b;--wall2:#2b5240;--panel:#1c2a23;--text:#e8f2ec;--line:#37524a;--accent:#9db0ff}}
:root[data-theme="dark"]{--wall:#35624b;--wall2:#2b5240;--panel:#1c2a23;--text:#e8f2ec;--line:#37524a;--accent:#9db0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--wall2);color:var(--text);font:18px/1.35 "Patrick Hand","Segoe Print","Comic Sans MS",sans-serif}
main{max-width:980px;margin:0 auto;display:grid;gap:0}
@media(min-width:800px){main{grid-template-columns:1.1fr 1fr;min-height:100vh;align-items:start}.stage{position:sticky;top:0;height:100vh;min-height:100vh}}
.stage{position:relative;background:radial-gradient(120% 90% at 30% 20%,var(--wall),var(--wall2));padding:16px 12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62vh}
h1{font:400 clamp(32px,7vw,48px)/1 "Caveat Brush","Patrick Hand",cursive;margin:4px 0 0;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);align-self:flex-start}
.sub{align-self:flex-start;margin:2px 0 0;color:#fff;opacity:.92}
#bubble{min-height:58px;max-width:320px;margin:10px 0 0;padding:10px 14px;background:#fffef8;color:#1f2d27;border:2px solid #2b2f9c;border-radius:16px 16px 16px 4px;transform:scale(.9);opacity:0;transition:.25s;align-self:center}
#bubble.on{opacity:1;transform:none}
#bubble:empty{display:none}
#youWhisper{max-width:300px;margin:8px 0 0;padding:4px 10px;color:#fff;background:#244d3b99;border-radius:12px;font-size:15px;align-self:center}
#youWhisper:empty{display:none}
#dollBtn{background:none;border:0;padding:0;cursor:pointer;width:min(88vw,380px);border-radius:24px}
#dollBtn:focus-visible{outline:3px dashed #fff;outline-offset:4px}
svg{width:100%;height:auto;display:block;overflow:visible}
.crack svg{width:36px}
svg *{transition:transform .5s ease}
#upper,#skirt,#armL,#armR,#figure{transform-origin:150px 150px}
#armL{transform-origin:130px 108px}#armR{transform-origin:170px 108px}
.pose-idle #figure{animation:breathe 4s ease-in-out infinite}
.pose-wave #armR{animation:wave .7s ease-in-out infinite alternate}
.pose-twirl #armL{transform:rotate(75deg)}.pose-twirl #armR{transform:rotate(-75deg)}
.pose-twirl #skirt{animation:spin .9s ease-in-out infinite alternate}
.pose-twirl #figure{animation:hop .9s ease-in-out infinite alternate}
.pose-bow #upper{transform:rotate(22deg)}
.pose-dance #figure{transform-origin:150px 300px;animation:sway 1s ease-in-out infinite alternate}
.pose-dance #armL{animation:wave2 .5s ease-in-out infinite alternate}.pose-dance #armR{animation:wave .5s ease-in-out infinite alternate}
.speaking #figure{animation:speak-bob .42s ease-in-out infinite alternate}
.talk-mouth{display:none}
.speaking #face .talk-mouth{display:block;animation:mouth .18s ease-in-out infinite alternate}
.blinking #face{transform-box:fill-box;transform-origin:center;animation:blink .18s ease-in-out}
.happy-pop #figure{animation:hop .55s ease-out 2}
.scared-shake #figure{animation:shake .16s linear 5}
.rebooting #figure{animation:crumple .6s ease both!important}
@keyframes breathe{50%{transform:translateY(-3px)}}
@keyframes wave{from{transform:rotate(-100deg)}to{transform:rotate(-62deg)}}
@keyframes wave2{from{transform:rotate(100deg)}to{transform:rotate(62deg)}}
@keyframes spin{from{transform:scaleX(1)}to{transform:scaleX(.35)}}
@keyframes hop{to{transform:translateY(-10px)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes speak-bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes mouth{to{ry:4}}
@keyframes blink{50%{transform:scaleY(.08)}}
@keyframes shake{25%{transform:translateX(-3px) rotate(-1deg)}75%{transform:translateX(3px) rotate(1deg)}}
@keyframes crumple{40%{transform:scale(.2,.4) rotate(20deg);opacity:.2}100%{transform:none}}
.panel{background:var(--panel);padding:18px 16px 28px;display:grid;gap:14px;align-content:start}
.grp h2{font:400 20px/1 "Caveat Brush","Patrick Hand",cursive;margin:0 0 6px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;color:var(--text);background:transparent;border:2px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#12201a}
.sw{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--panel) inset}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--text)}
select{max-width:100%;font:inherit;padding:7px 10px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}
.go{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:8px 16px;cursor:pointer}
:root[data-theme="dark"] .go{color:#12201a}
.chat{display:grid;gap:8px}
.chat h2{font:400 20px/1 "Caveat Brush","Patrick Hand",cursive;margin:0;color:var(--accent)}
.chat-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.icon-btn{font:inherit;color:var(--text);background:transparent;border:2px solid var(--line);border-radius:12px;padding:7px 10px;cursor:pointer;min-height:42px}
.icon-btn[disabled]{opacity:.45;cursor:not-allowed}
.chat-status{min-height:20px;color:var(--accent);font-size:15px}
.quick-play{display:flex;flex-wrap:wrap;gap:6px}
.quick-play button{font:inherit;color:var(--text);background:transparent;border:1px dashed var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.quick-play button:hover{border-color:var(--accent)}
.mood-line{font-size:15px;color:var(--accent)}
.chat-tools label{color:var(--accent)}
#voiceStatus{font-size:14px;overflow-wrap:anywhere}
.snowflake{position:absolute;left:50%;top:40%;z-index:3;font-size:26px;pointer-events:none;animation:snowball .65s ease-in forwards}
@keyframes snowball{to{transform:translate(34px,75px) rotate(220deg) scale(.65);opacity:0}}
.reboot{background:transparent;border:2px dashed var(--accent);color:var(--accent);border-radius:12px;padding:9px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:799px){
 main{grid-template-columns:minmax(0,1fr)}
 html{scroll-padding-top:calc(42svh + 12px)}
 .stage{position:sticky;top:0;z-index:5;height:42svh;min-height:310px;max-height:380px;padding:8px 12px;justify-content:center;box-shadow:0 5px 18px rgba(0,0,0,.16)}
 h1{font-size:32px}
 .sub{font-size:16px}
 #bubble{max-width:min(84vw,320px);max-height:68px;min-height:0;margin:4px 0 0;padding:7px 10px;font-size:16px;overflow:auto}
 #youWhisper{max-width:min(84vw,320px);margin:4px 0 0;font-size:14px}
 #dollBtn{width:min(48vw,24svh,210px)}
 .panel .grp{scroll-margin-top:calc(42svh + 12px)}
 #found{font-size:12px}
}
.stage{transition:background .6s}
@media(min-width:800px){.stage{position:sticky;top:0;height:100vh;min-height:100vh}}
.stage.haunted{background:radial-gradient(90% 75% at 50% 35%,#24402f 0%,#08120d 70%,#020504)}
.stage.haunted::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 40%,rgba(0,0,0,.75));pointer-events:none;animation:flick 5s infinite}
.haunted h1,.haunted .sub{color:#d9ffe8}.haunted h1{text-shadow:0 0 12px #ff2a2a88}
.haunted #bubble{background:#0a0f0c;color:#ff8a8a;border-color:#ff4a4a}
#bubble.whisper{font-style:italic;font-size:16px}
.haunted #doll{animation:twitch 7s steps(1) infinite}
.crack{position:absolute;width:36px;height:36px;padding:0;border:0;background:none;cursor:pointer;opacity:.35;z-index:2}
.crack:hover,.crack:focus-visible{opacity:1}
#c1{top:24%;left:8%}#c2{bottom:14%;right:10%}
#found{position:absolute;bottom:8px;left:12px;font-size:14px;color:#fff;opacity:.55}
.p{transition:none!important}
@keyframes twitch{0%,92%,100%{transform:none}93%{transform:translate(2px,-1px) rotate(1deg)}95%{transform:translate(-3px,1px) rotate(-1.5deg)}97%{transform:translate(1px,0)}}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}50%{opacity:.35}53%{opacity:1}75%{opacity:.7}78%{opacity:1}}
@keyframes rise{to{transform:translateY(-130px);opacity:0}}
@keyframes fall{to{transform:translate(18px,300px);opacity:0}}
@keyframes drift{to{transform:translate(var(--dx),-70px) scale(2.2);opacity:0}}
@keyframes rain{to{transform:translateY(320px)}}
@keyframes flash{to{opacity:0}}
</style>
</head>
